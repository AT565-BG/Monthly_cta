<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boomlet CTA: Concept 1, Wedding Season Opportunity</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1F7;--ink:#1d0540;--violet:#7D1EF5;--sky:#00BDFE;--mint:#00FCF8;--mute:#4a3a66}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:'DM Sans',Arial,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:1100px}
.b{background:#fff;color:var(--ink);border-radius:10px;padding:32px 20px 36px;display:grid;gap:32px;overflow:hidden}
h2{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:700;font-size:clamp(34px,9.5vw,52px);line-height:1.04;letter-spacing:-.02em;margin:0 0 16px}
.t p{font-size:17px;line-height:1.55;margin:0 0 24px;max-width:32em;color:var(--mute)}
.btn{display:block;text-align:center;background:var(--violet);color:#fff;font-weight:700;font-size:18px;padding:16px 28px;border-radius:99px;text-decoration:none;transition:background .2s}
.btn:hover{background:#6511cf}
.btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.board{background:#F6F0FF;border-radius:10px;padding:26px 14px 22px;display:grid;grid-template-columns:minmax(0,.7fr) repeat(3,minmax(0,1fr));column-gap:8px;align-items:center}
.you{grid-column:2;grid-row:1;justify-self:center;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:8px 14px;border-radius:99px;white-space:nowrap}
.stem{grid-column:2;grid-row:2;justify-self:center;width:3px;height:22px;background:var(--sky)}
.dot{grid-column:2;grid-row:3;justify-self:center;width:22px;height:22px;border-radius:50%;background:var(--mint);border:3px solid var(--sky);margin-bottom:10px;box-shadow:0 0 0 6px rgba(0,189,254,.18)}
.m{grid-row:4;background:var(--violet);color:#fff;font-weight:700;font-size:19px;text-align:center;padding:26px 0;border-radius:10px}
.m.off{background:rgba(125,30,245,.12);color:#6a3fb0}
.bracket{grid-column:2/5;grid-row:5;height:12px;margin-top:14px;border:2px solid var(--violet);border-top:0;border-radius:0 0 8px 8px}
.cap{grid-column:2/5;grid-row:6;text-align:center;font-size:15px;color:var(--mute);margin:10px 0 0}
@media(min-width:820px){
 .b{grid-template-columns:1fr 1fr;align-items:center;gap:56px;padding:56px 56px 56px 60px}
 .btn{display:inline-block}
 h2{font-size:clamp(44px,4.6vw,58px)}
 .board{padding:34px 24px 28px}
 .m{padding:32px 0;font-size:22px}
 .you{font-size:16px}
}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style></head><body><main>
<section class="b" aria-labelledby="h">
 <div class="t">
  <h2 id="h">The wedding window closes in January.</h2>
  <p>Three months of peak attention across every category. Brands that map creators early shape the conversation. The rest buy leftover reach.</p>
  <a class="btn" href="https://drive.google.com/file/d/1hb6zd0WQOoPmOuizSLMdxrLXcmE4I_ue/view?usp=drive_link">Discover Our Impact</a>
 </div>
 <div class="board" role="img" aria-label="Timeline: you are here in November; peak wedding season runs November to January">
  <span class="m off" style="grid-column:1">Oct</span><span class="m" style="grid-column:2">Nov</span><span class="m" style="grid-column:3">Dec</span><span class="m" style="grid-column:4">Jan</span>
  <span class="you">You are here</span><span class="stem"></span><span class="dot"></span>
  <div class="bracket"></div><p class="cap">Peak wedding-season window</p>
 </div>
</section>
</main></body></html>
